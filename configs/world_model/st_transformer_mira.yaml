# World model training on MiraData with a frozen ST-Transformer action encoder (41-frame
# windows over 81 frames) and a bidirectional, fully fine-tuned Wan world model.

name: world_model_st_transformer_mira

mode: train

manual_seed: 0

mixed_precision: true

datasets:
  train:
    type: VideoTarDataset
    meta_path: /path/to/miradata_tars/wids-meta.json
    preprocess_video_cfg:
      height: 480
      width: 832
      fps: 16
      num_frames: 81
      random_sample: true
      skip_head_seconds: 1.0
    dataloader_cfg:
      global_batch_size: 128
      num_workers: 4
      prefetch_factor: 1
      persistent_workers: true
      shuffle_chunk_size: 1000
      drop_last: true

models:
  transformer_cfg:
    model_name: /path/to/Wan2.2-TI2V-5B-Diffusers
    model_type: WanWorldModel
    enable_gradient_checkpoint: true
    param_names_to_optimize: ['']
    param_names_to_exclude: []
  idm_cfg:
    backend: st_transformer
    model_dim: 1024
    enc_blocks: 16
    num_heads: 16
    patch_size: 16
    dropout: 0.0
    height: 272
    width: 480
    enable_gradient_checkpoint: false
    param_names_to_optimize: ['']
    param_names_to_exclude: [rotary_embedding.freqs]
  fixed_idm_cfg:
    # A latent-action run's latent_action_state.pt, or a released model directory.
    state_path: /path/to/latent_action_st_transformer_mira/iter_5000/latent_action_state.pt
    idm_window_rgb_frames: 41
    fps: 16
    fdm_init: pretrained_wan
  action_cfg:
    latent_action_dim: 32
    num_rgb_frames: 81
    temporal_compression_ratio: 4
    num_context_frames: 1
    fixed_prompt: a video
    action_dropout_prob: 0.1
    gamma_init: 2.0
    st_transformer_action_compression_ratio: 4
  text_encoder_cfg: {}
  vae_cfg: {}
  scheduler_cfg:
    shift: 5.0
    weight_type: gaussian

path:
  pretrain_network: null
  experiments_root: experiments/world_model_st_transformer_mira

train:
  ema_decay: 0.99
  ema_warmup_step: 100
  lr_scheduler: constant_with_warmup
  warmup_iter: 100
  total_iter: 10000
  max_grad_norm: 1.0
  trainer: WorldModelTrainer
  optimizer:
    type: AdamW
    lr: 5.0e-05
    weight_decay: 0.0
    betas: [0.9, 0.95]

val:
  skip_first_eval: false
  sample_at_end: true
  sample_freq: 500
  latent_action_eval:
    height: 480
    width: 832
    fps: 16
    num_frames: 41
    num_inference_steps: 10
    save_video: true
    seed: 0
    transfer_mode: matrix
    use_ema: true
    clips:
    - name: mira_low
      path: assets/evaluation/latent_action_miradata/mira_low.mp4
    - name: mira_mid
      path: assets/evaluation/latent_action_miradata/mira_mid.mp4
    - name: mira_high
      path: assets/evaluation/latent_action_miradata/mira_high.mp4
    compute_gate_losses: false

logger:
  print_freq: 1
  save_checkpoint_freq: 200
  save_eval_checkpoint_freq: 1000
  save_eval_checkpoint_at_end: true
  use_wandb: false
